services:
  - type: web
    name: nova-finance
    runtime: docker
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "0"
      - key: APP_URL
        value: https://nova-finance-e2hp.onrender.com
      # Set these in the Render dashboard (do not commit secrets):
      # DB_DRIVER=mysql
      # DATABASE_URL=mysql://USER:PASSWORD@HOST:PORT/DATABASE
      # DB_SSL=1
      - key: DB_DRIVER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "1"
